<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10182b"><title>Aviso da rede Wi-Fi</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b1020;color:#f4f7ff;font:16px system-ui,sans-serif}.card{width:min(520px,100%);padding:28px;border-radius:22px;background:#151d33;border:1px solid #293451;text-align:center}.icon{font-size:38px;color:#6ee7b7}.tag{font-size:12px;font-weight:800;letter-spacing:.13em;color:#6ee7b7;margin-top:8px}h1{margin:8px 0 20px}.message{padding:20px;border-radius:14px;background:#0d1427;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;min-height:70px;text-align:left}.note{color:#9eabc8;font-size:13px;line-height:1.5;margin-top:20px}
</style></head><body><main class="card"><div class="icon">⌁</div><div class="tag">AVISO DA REDE</div><h1>Mensagem do administrador</h1><div class="message" id="message">Carregando aviso…</div><p class="note">Esta página atualiza automaticamente enquanto estiver aberta.</p></main>
<script>
const el=document.querySelector('#message');let last='';
async function update(){try{const r=await fetch('/api/message',{cache:'no-store'});const d=await r.json();if(d.text!==last){el.textContent=d.text||'Nenhum aviso no momento.';last=d.text;}}catch{el.textContent='Não foi possível carregar o aviso. Confira sua conexão.';}}
update();setInterval(update,3000);
</script></body></html>
