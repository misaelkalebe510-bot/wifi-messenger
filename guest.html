<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>Wi-Fi Messenger | Avisos</title><style>
:root{--ink:#172033;--muted:#6b7280;--line:#e7eaf0;--blue:#3767f5;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:var(--bg);color:var(--ink);font:16px Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(540px,100%)}.top{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:25px}.logo{height:48px;width:48px;display:grid;place-items:center;border-radius:16px;background:var(--blue);color:white;font-size:24px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:var(--blue)}h1{margin:3px 0 0;font-size:clamp(25px,5vw,32px);letter-spacing:-.04em}.card{background:white;border:1px solid var(--line);border-radius:25px;padding:clamp(24px,6vw,38px);box-shadow:0 18px 50px #18213a0a;text-align:center}.status{display:inline-flex;align-items:center;gap:7px;color:#16835d;background:#e9f9f1;border-radius:99px;padding:8px 12px;font-size:12px;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:#20ad76}h2{font-size:18px;margin:20px 0 14px}.byline{font-size:13px;color:var(--muted);margin-bottom:10px}.message{padding:22px;border:1px solid var(--line);border-radius:17px;background:#fbfcfe;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;text-align:left;min-height:90px;font-size:17px}.note{color:var(--muted);font-size:13px;line-height:1.6;margin:20px 0 0}button{border:0;border-radius:12px;padding:12px 16px;margin-top:16px;background:var(--blue);color:white;font:600 14px inherit;cursor:pointer}.hidden{display:none!important}
</style></head><body><main class="wrap"><header class="top"><div class="logo">↗</div><div><div class="eyebrow">Avisos e atualizações</div><h1>Wi-Fi Messenger</h1></div></header><section class="card"><span class="status"><span class="dot"></span><span id="state">Conectando</span></span><h2>Mensagem do administrador</h2><div class="byline" id="byline">Aguardando mensagem</div><div class="message" id="message">Carregando mensagem…</div><button id="notify">🔔 Ativar notificações</button><p class="note" id="note">Deixe esta página aberta para receber avisos. Para notificações do navegador, permita o acesso quando solicitado.</p></section></main>
<script>
const el=document.querySelector('#message'),state=document.querySelector('#state'),byline=document.querySelector('#byline'),notifyBtn=document.querySelector('#notify');let lastId=null;
async function enableNotifications(){if(!('Notification' in window)){document.querySelector('#note').textContent='Este navegador não oferece notificações. Deixe a página aberta para acompanhar mensagens.';return;}try{const p=await Notification.requestPermission();if(p==='granted'){notifyBtn.textContent='✓ Notificações ativadas';document.querySelector('#note').textContent='Notificações ativadas. Deixe esta página aberta para receber avisos.';}else{document.querySelector('#note').textContent='Notificações não permitidas. Você ainda pode ver as mensagens nesta página.';}}catch{}}
notifyBtn.addEventListener('click',enableNotifications);if('Notification' in window&&Notification.permission==='granted')notifyBtn.textContent='✓ Notificações ativadas';
async function update(){try{const r=await fetch('/api/message',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(d.id!==lastId){el.textContent=d.text||'Nenhum aviso no momento.';byline.textContent=d.text?(d.name?'Enviado por '+d.name:'Mensagem do administrador'): 'Aguardando mensagem';if(lastId!==null&&d.id&&d.id!==lastId&&'Notification'in window&&Notification.permission==='granted'){try{new Notification('Wi-Fi Messenger',{body:(d.name?d.name+': ':'')+d.text});}catch{}}lastId=d.id||null;}state.textContent='Atualizado agora';}catch{state.textContent='Sem conexão';}}
update();setInterval(update,3000);
</script></body></html>
