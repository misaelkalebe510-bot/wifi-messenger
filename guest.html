<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>Wi-Fi Messenger | Avisos</title>
<style>
:root{--ink:#172033;--muted:#6b7280;--line:#e7eaf0;--blue:#3767f5;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:var(--bg);color:var(--ink);font:16px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(540px,100%)}.top{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:25px}.logo{height:48px;width:48px;display:grid;place-items:center;border-radius:16px;background:var(--blue);color:white;font-size:24px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:800;color:var(--blue)}h1{margin:3px 0 0;font-size:clamp(25px,5vw,32px);letter-spacing:-.04em}.card{background:white;border:1px solid var(--line);border-radius:25px;padding:clamp(24px,6vw,38px);box-shadow:0 18px 50px #18213a0a;text-align:center}.status{display:inline-flex;align-items:center;gap:7px;color:#16835d;background:#e9f9f1;border-radius:99px;padding:8px 12px;font-size:12px;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:#20ad76}h2{font-size:18px;margin:20px 0 14px}.message{padding:22px;border:1px solid var(--line);border-radius:17px;background:#fbfcfe;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;text-align:left;min-height:90px;font-size:17px}.note{color:var(--muted);font-size:13px;line-height:1.6;margin:20px 0 0}
</style></head><body><main class="wrap"><header class="top"><div class="logo">↗</div><div><div class="eyebrow">Avisos e atualizações</div><h1>Wi-Fi Messenger</h1></div></header><section class="card"><span class="status"><span class="dot"></span><span id="state">Conectando</span></span><h2>Mensagem do administrador</h2><div class="message" id="message">Carregando mensagem…</div><p class="note">Esta página verifica automaticamente se há uma nova mensagem enquanto estiver aberta.</p></section></main>
<script>
const el=document.querySelector('#message'),state=document.querySelector('#state');let last='';
async function update(){try{const r=await fetch('/api/message',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(d.text!==last){el.textContent=d.text||'Nenhum aviso no momento.';last=d.text;}state.textContent='Atualizado agora';}catch{state.textContent='Sem conexão';el.textContent='Não foi possível carregar a mensagem. Tente atualizar a página.';}}
update();setInterval(update,3000);
</script></body></html>
